<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" role="img" aria-labelledby="title description">
  <title id="title">Capacity is a desired-versus-observed reconciliation loop</title>
  <desc id="description">The capacity manager reads waiting jobs and existing nodes, writes desired_nodes to PostgreSQL, and the local provisioner starts or drains agent processes until observed agents converge. Agents register and heartbeat back to the control plane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#345b74" stroke-width="1.7"/></marker>
    <style>.bg{fill:#f8f7f3}.white{fill:#fffdfa}.blue{fill:#e7eff1}.amber{fill:#fff0d8}.green{fill:#e7efdc}.ink{fill:#173143}.muted{fill:#687a83}.outline{stroke:#345b74;stroke-width:1.5}.line{stroke:#345b74;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#9a9e91;stroke-width:1.8;stroke-dasharray:6 6;fill:none;marker-end:url(#arrow)}.mono{font-family:Menlo,Consolas,monospace}.sans{font-family:Inter,Arial,sans-serif}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:650}.small{font-size:15px}.tag{font-size:13px;letter-spacing:1.4px;font-weight:700}@media(prefers-reduced-motion:no-preference){.line,.dash{stroke-dasharray:8 7;animation:move 1s linear infinite}@keyframes move{to{stroke-dashoffset:-15}}}</style>
  </defs>
  <rect class="bg" width="1160" height="520"/>
  <text x="48" y="60" class="sans title ink">Capacity is a reconciliation loop</text>
  <text x="48" y="89" class="sans small muted">The scheduler places jobs on nodes that exist. These two loops decide whether more nodes should exist.</text>

  <rect x="48" y="169" width="238" height="145" rx="8" class="blue outline"/>
  <text x="70" y="207" class="mono tag ink">OBSERVE</text>
  <text x="70" y="246" class="sans label ink">Capacity manager</text>
  <text x="70" y="277" class="sans small muted">waiting jobs + free slots</text>

  <rect x="350" y="169" width="238" height="145" rx="8" class="amber outline"/>
  <text x="372" y="207" class="mono tag ink">DURABLE INTENT</text>
  <text x="372" y="246" class="sans label ink">PostgreSQL</text>
  <text x="372" y="277" class="mono small ink">desired_nodes = 2</text>

  <rect x="652" y="169" width="238" height="145" rx="8" class="blue outline"/>
  <text x="674" y="207" class="mono tag ink">RECONCILE</text>
  <text x="674" y="246" class="sans label ink">Provisioner</text>
  <text x="674" y="277" class="sans small muted">start or drain processes</text>

  <rect x="954" y="169" width="158" height="145" rx="8" class="green outline"/>
  <text x="975" y="207" class="mono tag ink">OBSERVED</text>
  <text x="975" y="246" class="sans label ink">Agents</text>
  <text x="975" y="277" class="mono small ink">running = 2</text>

  <path d="M286 242 H349" class="line"/>
  <path d="M588 242 H651" class="line"/>
  <path d="M890 242 H953" class="line"/>
  <path d="M1033 315 V385 H168 V315" class="dash"/>
  <text x="381" y="411" class="sans small muted">registration and heartbeat update the next observation</text>
  <text x="48" y="475" class="sans small muted">A desired count is not a running process. Draining stops new claims before an agent exits.</text>
</svg>
