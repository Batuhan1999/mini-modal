  <rect x="530" y="180" width="30" height="28" rx="3" class="busy"/>
  <rect x="564" y="180" width="30" height="28" rx="3" class="free"/>
  <rect x="598" y="180" width="30" height="28" rx="3" class="free"/>
  <rect x="700" y="180" width="30" height="28" rx="3" class="busy"/>
  <rect x="734" y="180" width="30" height="28" rx="3" class="placed"/>
  <rect x="768" y="180" width="30" height="28" rx="3" class="placed"/>
  <rect x="802" y="180" width="30" height="28" rx="3" class="placed"/>
  <rect x="836" y="180" width="30" height="28" rx="3" class="placed"/>
  <rect x="870" y="180" width="30" height="28" rx="3" class="free"/>
  <rect x="904" y="180" width="30" height="28" rx="3" class="free"/>
  <rect x="938" y="180" width="30" height="28" rx="3" class="free"/>
  <rect x="695" y="175" width="278" height="38" rx="6" class="chosen"/>
  <text x="360" y="234" class="sans note no">✗ only 2 free</text>
  <text x="700" y="234" class="sans note ok">✓ fits, 3 left</text>
  <text x="1010" y="204" class="sans label ink">assigned to node-b</text>
  <rect x="40" y="266" width="260" height="66" rx="8" class="card"/>
  <text x="60" y="294" class="mono job ink">job 2</text>
  <text x="60" y="318" class="sans small muted">needs 2 CPU</text>
  <rect x="360" y="272" width="30" height="28" rx="3" class="busy"/>
  <rect x="394" y="272" width="30" height="28" rx="3" class="busy"/>
  <rect x="428" y="272" width="30" height="28" rx="3" class="busy"/>
  <rect x="462" y="272" width="30" height="28" rx="3" class="busy"/>
  <rect x="496" y="272" width="30" height="28" rx="3" class="busy"/>
  <rect x="530" y="272" width="30" height="28" rx="3" class="busy"/>
  <rect x="564" y="272" width="30" height="28" rx="3" class="placed"/>
  <rect x="598" y="272" width="30" height="28" rx="3" class="placed"/>
  <rect x="355" y="267" width="278" height="38" rx="6" class="chosen"/>
  <rect x="700" y="272" width="30" height="28" rx="3" class="busy"/>
  <rect x="734" y="272" width="30" height="28" rx="3" class="placed"/>
  <rect x="768" y="272" width="30" height="28" rx="3" class="placed"/>
  <rect x="802" y="272" width="30" height="28" rx="3" class="placed"/>
  <rect x="836" y="272" width="30" height="28" rx="3" class="placed"/>
  <rect x="870" y="272" width="30" height="28" rx="3" class="free"/>
  <rect x="904" y="272" width="30" height="28" rx="3" class="free"/>
  <rect x="938" y="272" width="30" height="28" rx="3" class="free"/>
  <text x="360" y="326" class="sans note ok">✓ fits, 0 left</text>
  <text x="700" y="326" class="sans note muted">not checked</text>
  <text x="1010" y="296" class="sans label ink">assigned to node-a</text>
  <rect x="40" y="358" width="260" height="66" rx="8" class="card"/>
  <text x="60" y="386" class="mono job ink">job 3</text>
  <text x="60" y="410" class="sans small muted">needs 4 CPU</text>
  <rect x="360" y="364" width="30" height="28" rx="3" class="busy"/>
  <rect x="394" y="364" width="30" height="28" rx="3" class="busy"/>
  <rect x="428" y="364" width="30" height="28" rx="3" class="busy"/>
  <rect x="462" y="364" width="30" height="28" rx="3" class="busy"/>
  <rect x="496" y="364" width="30" height="28" rx="3" class="busy"/>
  <rect x="530" y="364" width="30" height="28" rx="3" class="busy"/>
  <rect x="564" y="364" width="30" height="28" rx="3" class="placed"/>
  <rect x="598" y="364" width="30" height="28" rx="3" class="placed"/>
  <rect x="700" y="364" width="30" height="28" rx="3" class="busy"/>
  <rect x="734" y="364" width="30" height="28" rx="3" class="placed"/>
  <rect x="768" y="364" width="30" height="28" rx="3" class="placed"/>
  <rect x="802" y="364" width="30" height="28" rx="3" class="placed"/>
  <rect x="836" y="364" width="30" height="28" rx="3" class="placed"/>
  <rect x="870" y="364" width="30" height="28" rx="3" class="free"/>
  <rect x="904" y="364" width="30" height="28" rx="3" class="free"/>
  <rect x="938" y="364" width="30" height="28" rx="3" class="free"/>
  <text x="360" y="418" class="sans note no">✗ 0 free</text>
  <text x="700" y="418" class="sans note no">✗ only 3 free</text>
  <text x="1010" y="388" class="sans label ink">stays pending</text>
  <text x="1010" y="412" class="sans small muted">no room right now</text>
  <rect x="40" y="450" width="260" height="66" rx="8" class="card"/>
  <text x="60" y="478" class="mono job ink">job 4</text>
  <text x="60" y="502" class="sans small muted">needs 16 CPU</text>
  <rect x="360" y="456" width="30" height="28" rx="3" class="busy"/>
  <rect x="394" y="456" width="30" height="28" rx="3" class="busy"/>
  <rect x="428" y="456" width="30" height="28" rx="3" class="busy"/>
