  <rect x="938" y="456" width="30" height="28" rx="3" class="free"/>
  <text x="360" y="510" class="sans note no">✗ never fits</text>
  <text x="700" y="510" class="sans note no">✗ never fits</text>
  <text x="1010" y="480" class="sans label ink">unschedulable</text>
  <text x="1010" y="504" class="sans small muted">bigger than any node</text>
  <rect x="40" y="548" width="20" height="20" rx="3" class="busy"/><text x="68" y="564" class="sans small muted">already assigned or running</text>
  <rect x="320" y="548" width="20" height="20" rx="3" class="placed"/><text x="348" y="564" class="sans small muted">placed in this pass</text>
  <rect x="530" y="548" width="20" height="20" rx="3" class="free"/><text x="558" y="564" class="sans small muted">free</text>
  <text x="640" y="564" class="sans small muted">· memory and GPUs are checked the same way</text>
