<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 710" role="img" aria-labelledby="title desc">
  <title id="title">mini-modal architecture</title>
  <desc id="desc">The Python SDK calls the control plane over HTTP. The control plane is one Go process with an HTTP and gRPC API, a scheduler, a capacity manager, and a provisioner. Each of them reads or writes PostgreSQL. The API stores function archives in S3. The provisioner starts and drains node agents, which talk to the API over gRPC, fetch archives from S3, and run functions in Docker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#345b74" stroke-width="1.6"/></marker>
    <marker id="arrow-hint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#bf7a3b" stroke-width="1.6"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff0d8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#f3dcb8" stroke-width="2"/></pattern>
    <style>
      .bg{fill:#f8f7f3}.ink{fill:#173143}.muted{fill:#687a83}.hinttext{fill:#bf7a3b}
      .blue{fill:#e7eff1;stroke:#345b74;stroke-width:1.5}.store{fill:url(#hatch);stroke:#bf7a3b;stroke-width:1.5}.green{fill:#e7efdc;stroke:#64834c;stroke-width:1.5}.frame{fill:#fffdfa;stroke:#c5d1d2;stroke-width:1.5}
      .line{fill:none;stroke:#345b74;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}
      .hint{fill:none;stroke:#bf7a3b;stroke-width:1.8;stroke-dasharray:5 5;marker-end:url(#arrow-hint)}
      .mono{font-family:Menlo,Consolas,monospace}.sans{font-family:Inter,"Helvetica Neue",Arial,sans-serif}
      .label{font-size:21px;font-weight:650}.small{font-size:16px}.edge{font-size:14px}.tag{font-size:13px;letter-spacing:1.8px;font-weight:700}
    </style>
  </defs>
  <rect class="bg" width="1100" height="710"/>

  <!-- Client -->
  <rect x="410" y="30" width="300" height="100" rx="8" class="blue"/>
  <text x="432" y="62" class="mono tag muted">CLIENT</text>
  <text x="432" y="92" class="sans label ink">Python SDK</text>
  <text x="432" y="116" class="mono small muted">deploy · spawn · get</text>

  <!-- Object store -->
  <rect x="850" y="30" width="220" height="100" rx="8" class="store"/>
  <text x="872" y="62" class="mono tag muted">FUNCTION CODE</text>
  <text x="872" y="92" class="sans label ink">S3 store</text>
  <text x="872" y="116" class="mono small muted">archives by hash</text>

  <!-- Control plane process -->
  <rect x="350" y="160" width="420" height="486" rx="10" class="frame"/>
  <text x="374" y="190" class="mono tag muted">CONTROL PLANE · ONE GO PROCESS</text>

  <rect x="374" y="206" width="372" height="80" rx="8" class="blue"/>
  <text x="396" y="240" class="sans label ink">HTTP + gRPC API</text>
  <text x="396" y="266" class="sans small muted">deploys, calls, agent requests</text>

  <rect x="374" y="316" width="372" height="80" rx="8" class="blue"/>
  <text x="396" y="350" class="sans label ink">Scheduler</text>
  <text x="396" y="376" class="sans small muted">puts pending jobs on nodes</text>

  <rect x="374" y="426" width="372" height="80" rx="8" class="blue"/>
  <text x="396" y="460" class="sans label ink">Capacity manager</text>
  <text x="396" y="486" class="sans small muted">decides how many nodes are needed</text>

  <rect x="374" y="536" width="372" height="80" rx="8" class="blue"/>
  <text x="396" y="570" class="sans label ink">Provisioner</text>
  <text x="396" y="596" class="sans small muted">starts and drains agent processes</text>

  <!-- PostgreSQL -->
  <rect x="30" y="206" width="200" height="410" rx="8" class="store"/>
  <text x="52" y="238" class="mono tag muted">SOURCE OF TRUTH</text>
  <text x="52" y="268" class="sans label ink">PostgreSQL</text>
  <text x="52" y="314" class="mono edge ink">jobs</text>
  <text x="52" y="342" class="mono edge ink">job_events</text>
  <text x="52" y="370" class="mono edge ink">job_logs</text>
  <text x="52" y="398" class="mono edge ink">job_results</text>
  <text x="52" y="426" class="mono edge ink">functions</text>
  <text x="52" y="454" class="mono edge ink">function_versions</text>
  <text x="52" y="482" class="mono edge ink">nodes</text>
  <text x="52" y="510" class="mono edge ink">node_pools</text>

  <!-- PostgreSQL connections -->
  <path d="M372 246 H234" class="line both"/>
  <text x="244" y="236" class="mono edge muted">job state</text>
  <path d="M372 356 H234" class="line both"/>
  <text x="244" y="346" class="mono edge muted">assignments</text>
  <path d="M372 466 H234" class="line"/>
  <text x="244" y="456" class="mono edge muted">desired nodes</text>
  <path d="M234 576 H370" class="line"/>
  <text x="244" y="566" class="mono edge muted">desired nodes</text>

  <!-- Wake-up hint -->
  <path d="M700 287 V312" class="hint"/>
  <text x="692" y="305" text-anchor="end" class="mono edge hinttext">wake-up</text>

  <!-- SDK to API -->
  <path d="M560 131 V202" class="line"/>
  <text x="572" y="150" class="mono tag muted">HTTP</text>

  <!-- API stores archives -->
  <path d="M726 206 V80 H846" class="line"/>
  <text x="738" y="104" class="mono muted" font-size="13">store archive</text>

  <!-- Agents -->
  <rect x="850" y="206" width="220" height="124" rx="8" class="green"/>
  <text x="872" y="238" class="mono tag muted">DATA PLANE</text>
  <text x="872" y="268" class="sans label ink">Node agents</text>
  <text x="872" y="294" class="sans small muted">claim · renew lease</text>
  <text x="872" y="316" class="sans small muted">stream logs · report</text>

  <path d="M748 246 H846" class="line both"/>
  <text x="776" y="236" class="mono tag muted">gRPC</text>

  <path d="M960 205 V134" class="line"/>
  <text x="952" y="176" text-anchor="end" class="mono edge muted">fetch archive</text>

  <path d="M748 576 H900 V334" class="line"/>
  <text x="782" y="566" class="mono edge muted">start · drain</text>

  <rect x="940" y="410" width="130" height="90" rx="8" class="green"/>
  <text x="962" y="450" class="sans label ink">Docker</text>
  <text x="962" y="476" class="sans small muted">runs greet()</text>
  <path d="M1005 331 V406" class="line"/>
  <text x="1013" y="374" class="mono edge muted">run</text>

  <!-- Legend -->
  <path d="M30 674 H70" class="line"/>
  <text x="82" y="679" class="sans small muted">request, read, or write</text>
  <path d="M300 674 H340" class="hint"/>
  <text x="352" y="679" class="sans small muted">hint only, PostgreSQL is the queue</text>
</svg>
