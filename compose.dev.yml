name: mini-modal-devbox

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /workspace
    command: sleep infinity
    cpus: "${MINI_MODAL_DEV_CPUS:-4.0}"
    mem_limit: "${MINI_MODAL_DEV_MEMORY:-6g}"
    memswap_limit: "${MINI_MODAL_DEV_MEMORY:-6g}"
    pids_limit: ${MINI_MODAL_DEV_PIDS:-1024}
    shm_size: 256m
    stop_grace_period: 10s
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      MINI_MODAL_ENV: development-container
      JOBS: "${JOBS:-}"
      CONCURRENCY: "${CONCURRENCY:-}"
      AGENTS: "${AGENTS:-}"
      BENCHMARK_LABEL: "${BENCHMARK_LABEL:-sync-scheduler}"
    volumes:
      - .:/workspace
      - go-module-cache:/home/developer/go/pkg/mod
      - go-build-cache:/home/developer/.cache/go-build

volumes:
  go-module-cache:
  go-build-cache:
