syntax = "proto3";

package minimodal.agent.v1;

option go_package = "mini-modal/gen/agent/v1;agentv1";

message Assignment {
  string job_id = 1;
  string node_id = 2;
  int64 attempt = 3;
  string command = 4;
  repeated string args = 5;
  string image = 6;
  int64 cpus = 7;
  int64 memory_gb = 8;
  bool should_cancel = 9;
}

message ClaimRequest {
  string node_id = 1;
}

message ClaimResponse {
  Assignment assignment = 1;
}

message CompleteRequest {
  string job_id = 1;
  int64 attempt = 2;
}

message CompleteResponse {}

message FailRequest {
  string job_id = 1;
  int64 attempt = 2;
}

message FailResponse {}

enum LogSource {
  LOG_SOURCE_UNSPECIFIED = 0;
  LOG_SOURCE_STDOUT = 1;
  LOG_SOURCE_STDERR = 2;
  LOG_SOURCE_SYSTEM = 3;
}

message StreamLogsResponse {
  int64 chunks_received = 1;
}

message StreamLogsRequest {
  string job_id = 1;
  int64 attempt = 2;
  int64 sequence = 3;
  LogSource source = 4;
  bytes data = 5;
  int64 created_at_unix_ms = 6;
}

message CancelRequest {
  string job_id = 1;
  int64 attempt = 2;
}
message CancelResponse {}

service AgentService {
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc Complete(CompleteRequest) returns (CompleteResponse);
  rpc Fail(FailRequest) returns (FailResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc RenewAssignment(RenewAssignmentRequest) returns (RenewAssignmentResponse);
  rpc StreamLogs(stream StreamLogsRequest) returns (StreamLogsResponse);
}

message RegisterNodeRequest {
  string node_id = 1;
  string gpu_type = 2;
  int32 total_gpus = 3;
  int32 total_cpus = 4;
  int32 total_memory_gb = 5;
}

message RegisterNodeResponse {}

message RenewAssignmentRequest {
  Assignment assignment = 1;
}
message RenewAssignmentResponse {
  bool should_cancel = 1;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {}
