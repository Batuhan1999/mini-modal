root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
pre_cmd = ["go build -o ./tmp/agent ./cmd/agent"]
cmd = "go build -o ./tmp/controlplane ./cmd/controlplane"
entrypoint = ["./tmp/controlplane"]
include_ext = ["go", "html", "css", "js"]
include_file = [".env"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test.go"]
delay = 500
send_interrupt = true
kill_delay = "500ms"
stop_on_error = true

[misc]
clean_on_exit = true
