[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-modal-client"
version = "0.1.0"
description = "Python client for the mini-modal control plane"
requires-python = ">=3.9"
dependencies = ["requests>=2.28,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_modal*"]
